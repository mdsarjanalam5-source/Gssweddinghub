name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  actions: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP files
        shell: bash
        run: |
          mkdir -p extracted
          find . -maxdepth 3 -type f -name '*.zip' ! -path './.git/*' -print
          while IFS= read -r -d '' z; do
            unzip -o "$z" -d extracted
          done < <(find . -maxdepth 3 -type f -name '*.zip' ! -path './.git/*' -print0)
          while IFS= read -r -d '' z; do
            unzip -o "$z" -d extracted
          done < <(find extracted -type f -name '*.zip' -print0)
          echo '--- Gradle settings found ---'
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: Gradle settings file not found'
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Gradle root: $ROOT"
          if [ ! -f "$ROOT/app/build.gradle.kts" ] && [ ! -f "$ROOT/app/build.gradle" ]; then
            echo 'ERROR: app Gradle file not found'
            find "$ROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle -p "$BUILD_ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSS-Wedding-Hub-debug-APK
          path: ${{ env.BUILD_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
