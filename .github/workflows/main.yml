name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project ZIP
        run: |
          mkdir -p project
          unzip -o GSS_Wedding_Hub_Firebase_Android_Studio.zip -d project
          if [ -f project/gss-wedding-hub-project.zip ]; then
            unzip -o project/gss-wedding-hub-project.zip -d project
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSS-Wedding-Hub-debug-APK
          path: project/app/build/outputs/apk/debug/*.apk
