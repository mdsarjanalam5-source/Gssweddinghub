name: Extract ZIP and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Studio project ZIP
        run: |
          test -f GSS_Wedding_Hub_Firebase_Android_Studio.zip
          mkdir -p extracted
          unzip -q -o GSS_Wedding_Hub_Firebase_Android_Studio.zip -d extracted
          find extracted -maxdepth 2 -type f | head -40

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: extracted/GSSWeddingHub
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSS-Wedding-Hub-debug-APK
          path: extracted/GSSWeddingHub/app/build/outputs/apk/debug/app-debug.apk
          
