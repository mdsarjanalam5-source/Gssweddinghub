
name: Build GSS Wedding Hub APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'gss-wedding-hub-project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q gss-wedding-hub-project.zip -d project
          cp -a project/. .
          rm -rf project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSS-Wedding-Hub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
